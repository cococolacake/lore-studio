# Runs on every pull request (and push to main): quick checks so bugs are caught before merging.
# Shows as a green ✓ or red ✗ on the pull request. No GPU needed.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"   # the oldest Python Lore Studio supports
          cache: pip               # reuse downloaded packages between runs
          cache-dependency-path: .github/workflows/checks.yml

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install
        run: |
          pip install pytest ruff av numpy imageio-ffmpeg
          # ffmpeg from a pip package: much quicker than apt-get update + install
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg

      - name: Python files compile
        run: python -m compileall -q main.py studio

      - name: No leftover code (unused imports and variables)
        run: |
          ruff check .
          npm install --no-save eslint@9
          npx eslint .

      - name: Shell scripts are valid
        run: for f in *.sh; do bash -n "$f" || exit 1; done

      - name: Tests
        run: python -m pytest -q tests

      - name: Shared files match the other app (warnings only)
        run: python .github/check_shared.py
        env:
          OTHER_APP_REPO: ${{ vars.OTHER_APP_REPO }}

      - name: Browser smoke test (every page opens without errors)
        run: |
          # uses the Google Chrome that GitHub's machines already have, so no browser download
          npm install --no-save playwright@1
          LORE_STUDIO_HOME=/tmp/smoke_home python main.py --browser --port 8765 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          SMOKE_CHANNEL=chrome SMOKE_URL=http://127.0.0.1:8765 SMOKE_CAMPAIGN=/tmp/smoke_campaign node tests/smoke.mjs || (cat /tmp/app.log; exit 1)
