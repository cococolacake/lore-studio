# Push a tag like v0.7.0 to publish a release:
#   lore-studio-0.7.0.zip       the app (the repo without tests and dev files)
#   lore-studio-bridge.zip      the Foundry module
#   module.json                 the module's manifest; Foundry reads releases/latest/download/module.json
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('studio/__init__.py').read())[1])")
          mod=$(python3 -c "import json;print(json.load(open('foundry/lore-studio-bridge/module.json'))['version'])")
          echo "tag $tag, app $app, module $mod"
          [ "$tag" = "$app" ] && [ "$tag" = "$mod" ] || { echo "::error::Bump studio/__init__.py and module.json to $tag first"; exit 1; }

      - name: Build the downloads
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          # the app: everything tracked, minus tests and CI
          git archive --format=zip --prefix="lore-studio-$v/" -o "dist/lore-studio-$v.zip" HEAD \
            ':!tests' ':!.github' ':!.gitattributes'
          # the Foundry module, with its download link pointing at this release
          python3 - "$v" <<'PY'
          import json, sys
          v = sys.argv[1]
          p = "foundry/lore-studio-bridge/module.json"
          m = json.load(open(p))
          m["download"] = f"https://github.com/${{ github.repository }}/releases/download/v{v}/lore-studio-bridge.zip"
          json.dump(m, open(p, "w"), indent=2, ensure_ascii=False)
          json.dump(m, open("dist/module.json", "w"), indent=2, ensure_ascii=False)
          PY
          (cd foundry/lore-studio-bridge && zip -qr ../../dist/lore-studio-bridge.zip .)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(python3 - "$v" <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md").read() if __import__("os").path.exists("CHANGELOG.md") else ""
          m = re.search(rf"^## {re.escape(v)}.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print((m[1].strip() if m else f"Lore Studio {v}") + "\n\n**Install:** download `lore-studio-" + v + ".zip`, unzip it, and run `Install.bat` (Windows) or `./install.sh` (Linux). See the README.\n\n**Foundry:** install the module from the manifest URL `https://github.com/${{ github.repository }}/releases/latest/download/module.json`.")
          PY
          )
          # not --prerelease: Foundry's manifest link (releases/latest) skips pre-releases
          title="Lore Studio $v"; case "$v" in 0.*) title="$title (beta)";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$title" --notes "$notes"
